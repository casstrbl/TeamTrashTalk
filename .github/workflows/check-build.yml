name: Check build (temporary)
on:
  push:
    branches: [glass-redesign-check]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec tsc --noEmit -p . > tsc.log 2>&1 || true
      - run: pnpm build > build.log 2>&1 || (cat build.log; exit 1)
      - run: mkdir -p out && cp -r dist out/dist && cp tsc.log build.log out/
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
