name: Check build (temporary)
on:
  push:
    branches: [glass-redesign-check]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec tsc --noEmit -p . > tsc.log 2>&1 || true
      - run: pnpm build > build.log 2>&1 || true
      - run: mkdir -p dist
      - run: mkdir -p out && cp -r dist out/dist && cp tsc.log build.log out/
      # the built site goes on its own throwaway branch, so it can be fetched with git
      - run: |
          cd out
          git init -q -b glass-redesign-preview
          git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "Preview build."
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" glass-redesign-preview
